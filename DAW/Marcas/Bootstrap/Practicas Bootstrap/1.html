<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Grid</title>
  <link rel="stylesheet" href="../Practicas Bootstrap/css/bootstrap.min.css">
</head>

<body class="bg-light">

  <!-- HEADER -->
  <header class="container-fluid bg-success text-white p-5">
    <h1>Header</h1>
    <p>12 Columns</p>
  </header>

  <!-- MAIN + ASIDE -->
  <section class="container my-4">
    <div class="row g-4">

      <main class="col-md-8 bg-white p-4">
        <h2>MAIN</h2>
        <p>8 Columns</p>
        <p>Lorem ipsum dolor sit amet...</p>
      </main>

      <aside class="col-md-4 bg-secondary bg-opacity-25 p-4">
        <h2>ASIDE</h2>
        <p>4 Columns</p>
      </aside>

    </div>
  </section>

  <!-- 3 COLUMN SECTION -->
  <section class="container my-4">
    <div class="row g-4">

      <div class="col-md-4 bg-primary text-white p-4">
        <h5>3 Columns</h5>
        <p>Lorem ipsum...</p>
      </div>

      <div class="col-md-4 bg-primary text-white p-4">
        <h5>3 Columns</h5>
        <p>Lorem ipsum...</p>
      </div>

      <div class="col-md-4 bg-primary text-white p-4">
        <h5>3 Columns</h5>
        <p>Lorem ipsum...</p>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer class="container-fluid bg-dark text-white p-4">
    <p>Footer - 12 Columns</p>
  </footer>

</body>
</html>
